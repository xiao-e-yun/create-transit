plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // The dev runs load route from source, and mixin configs are registered per
    // project -- without this line route's mixins silently never apply in a
    // transit run and its Create accessors fail as ClassCastException.
    config 'create_routes.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id.replace('_', '-')}-mc${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Create/Ponder mixin refmaps contain SRG names; remap them to the
            // official mappings used in this dev environment, otherwise mixins
            // fail with "could not find any targets matching 'm_xxxxx'".
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // A dev client for this mod is a dev client for route too: the two
            // load as one game, and route's mixins (the schedule screen's
            // editor entry point) have nothing to attach to without it.
            mods {
                create_routes {
                    source project(':route').sourceSets.main
                }
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Create, Ponder, Flywheel
    maven { url = "https://maven.createmod.net" }
    // Registrate mirror
    maven { url = "https://maven.ithundxr.dev/mirror" }
    // Forge Config API Port
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    // JEI
    maven { url = "https://maven.blamejared.com" }
    // JEI Integration, which is published to CurseForge and nowhere else.
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create and its libraries (https://wiki.createmod.net/developers/depend-on-create/forge-1.20.1)
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))

    // MixinExtras (used by Create; required on the dev classpath)
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")

    // Mixin's annotation processor, which generates the refmap MixinGradle declares
    annotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")

    // JEI, so the development client can look up recipes. The mod ships no JEI
    // plugin and no source file mentions it, so the runtime jar is the entire
    // dependency -- nothing to compile against, and nothing for mods.toml to
    // declare, because the shipped mod neither needs JEI nor notices it.
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    // JEI Integration, which puts registry names and tags in item tooltips --
    // worth having while building blocks that are copies of Create's and have
    // to be told apart. Same terms as JEI above: runtime, dev only.
    //
    // Pinned by CurseForge file id rather than by a version string because it is
    // published to CurseForge alone, and read through cursemaven because that is
    // the only maven that fronts it. The id is not a version and cannot be
    // bumped by editing digits -- see the README row for where it comes from.
    runtimeOnly(fg.deobf("curse.maven:jei-integration-${jei_integration_project}:${jei_integration_file}"))

    // A product-line dependency, not a code one -- see mods.toml.
    implementation project(':route')
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    // Tooling state written under the resource tree is invisible to git status
    // (it is ignored globally) but is not invisible to the jar.
    exclude '**/.omc/**'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// ---------------------------------------------------------------------------
// Block entity renderer transforms, dumped for the offline renderer.
//
// A partial model's coordinates are meaningless until you know which renderer
// draws it and what it does to the model first -- and Minecraft's model format
// cannot record that. scripts/mcrender reads those matrices from JSON, and this
// is what produces them: not a description of Create's arithmetic but a replay
// of Create's own call chain against a real transform stack, so it cannot drift
// the way a hand-ported copy would.
//
// A separate source set keeps the tool out of the shipped jar while still
// compiling against the mod's full classpath.

sourceSets {
    tools {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // The mod only compiles against the flywheel API, but this tool *calls* it,
    // so the real classes have to be there at runtime too.
    toolsImplementation(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
}

def transformTable = file("${rootDir}/scripts/transforms/create-${create_version}.json")

tasks.register('dumpTransforms', JavaExec) {
    group = 'build'
    description = 'Write the renderer transform matrices the offline renderer reads.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'me.xiaoeyun.createtransit.tools.DumpTransforms'
    args transformTable.absolutePath, create_version as String
}

// Wiring this into `check` is what makes the committed table trustworthy. Every
// assertion and every render downstream is computed *through* these matrices, so
// nothing computed from them can notice them being wrong; only regenerating and
// comparing can. Failing the build the moment Create's chain changes beats any
// checksum or version note, because it needs nobody to remember anything.
tasks.register('checkTransforms', JavaExec) {
    group = 'verification'
    description = 'Fail if the committed transform table no longer matches Create.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'me.xiaoeyun.createtransit.tools.DumpTransforms'
    def fresh = layout.buildDirectory.file('tmp/transforms-check.json')
    outputs.upToDateWhen { false }
    args fresh.get().asFile.absolutePath, create_version as String
    doLast {
        if (!transformTable.exists())
            throw new GradleException(
                "no transform table at ${transformTable}; run ./gradlew dumpTransforms")
        def slurper = new groovy.json.JsonSlurper()
        // Compare only the matrices: the surrounding fields carry provenance
        // that legitimately differs between producers, and diffing those would
        // train people to ignore this check.
        def committed = slurper.parse(transformTable).transforms
            .collectEntries { k, v -> [k, v.matrices] }
        def current = slurper.parse(fresh.get().asFile).transforms
            .collectEntries { k, v -> [k, v.matrices] }
        if (committed != current) {
            def names = (committed.keySet() + current.keySet()).findAll {
                committed[it] != current[it]
            }
            throw new GradleException(
                "transform table is out of date for ${names.join(', ')}.\n" +
                "  committed: ${transformTable}\n" +
                "  freshly dumped: ${fresh.get().asFile}\n" +
                "Run ./gradlew dumpTransforms, then re-run the renderer's " +
                "fixture check -- reference images are computed through these " +
                "matrices and will need regenerating too.")
        }
        logger.lifecycle("transform table matches Create ${create_version}")
    }
}

tasks.named('check') {
    dependsOn 'checkTransforms'
}
