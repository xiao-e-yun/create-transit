modLoader="javafml" #mandatory
# FML language loader version, versioned independently of NeoForge itself.
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/xiao-e-yun/create-transit/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://github.com/xiao-e-yun/create-transit"
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

# Unlike Forge 1.20.1, NeoForge reads the mixin config from here rather than
# from a MixinGradle-written jar manifest attribute.
[[mixins]]
config="create_transit.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Flywheel and Ponder need no rows of their own: Create mandates both, so any
# world where this loads already has them.
#
# The floor is where the earliest binding this mod makes first exists --
# LogisticsManager.getInventoryIdentifierFromLink, absent until 6.0.7. The cap
# is there because the break that set that floor arrived in a patch bump, and a
# mod that mixins into sixteen internal classes cannot promise the next minor.
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.7,6.1.0)"
    ordering="AFTER"
    side="BOTH"
