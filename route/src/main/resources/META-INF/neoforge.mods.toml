modLoader="javafml" #mandatory
# FML language loader version, versioned independently of NeoForge itself.
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/xiao-e-yun/create-transit/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://github.com/xiao-e-yun/create-transit"
authors="${mod_authors}"
logoFile="logo.png"
description='''${mod_description}'''

# Unlike Forge 1.20.1, NeoForge reads the mixin config from here rather than
# from a MixinGradle-written jar manifest attribute.
[[mixins]]
config="create_routes.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Flywheel and Ponder need no rows of their own: Create mandates both, so any
# world where this loads already has them.
#
# Everything this mod binds -- ScheduleRuntime, ScheduleScreen's private fields,
# ModularGuiLineBuilder, TrainMapManager -- is already the shape it targets by
# 6.0.6, but 6.0.7 is the first Create release with a tag to point at and the
# first this range was checked against. The cap is there because Create reshapes
# internals in patch releases, which a mixin against them cannot ride out.
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.7,6.1.0)"
    ordering="AFTER"
    side="BOTH"
