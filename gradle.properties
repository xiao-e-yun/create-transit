# MDK-1.21.1-NeoGradle defaults; NeoGradle needs far less memory than
# ForgeGradle's decompile step did.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment layers community parameter names over the official mappings.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17


## Environment Properties

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Create builds against 21.1.219; anything in the 21.1 line satisfies it.
neo_version=21.1.235
neo_version_range=[21.1.0,)
# FML language loader version, bumped independently of NeoForge itself.
loader_version_range=[1,)


## Dependency Versions (see https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1)

create_version=6.0.10-280
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# JEI, in the development client only (see the dependency block in build.gradle)
jei_version=19.21.0.247


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=create_transit
# The human-readable display name for the mod.
mod_name=Create: Transit
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.1.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=me.xiaoeyun.createtransit
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=xiaoeyun
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Links separate Create logistics networks into a supply chain: freight crosses between sovereign networks like a border, stamped with a transit label and cleared at a customs gate.
