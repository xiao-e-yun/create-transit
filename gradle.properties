# ModDevGradle needs far less memory than ForgeGradle's decompile step did, and
# fetches Minecraft through NFRT's shared cache rather than running the NeoForm
# pipeline once per subproject the way NeoGradle did.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment layers community parameter names over the official mappings.
neoForge.parchment.minecraftVersion=1.21.1
neoForge.parchment.mappingsVersion=2024.11.17


## Environment Properties

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Create builds against 21.1.219; anything in the 21.1 line satisfies it.
neo_version=21.1.235
neo_version_range=[21.1.0,)
# FML language loader version, bumped independently of NeoForge itself.
loader_version_range=[1,)


## Dependency Versions (see https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1)

create_version=6.0.10-280
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# JEI, in the development client only (see the dependency block in build.gradle)
jei_version=19.21.0.247


## Mod Properties
#
# Per-module (mod_id, mod_name, mod_version, mod_group_id, mod_description) live in
# route/gradle.properties and transit/gradle.properties -- this is a two-mod repo, and
# Gradle scopes a subproject's own gradle.properties to that subproject alone.

# The license both mods ship under. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The authors of the mods. This is a simple text string that is used for display purposes in the mod list.
mod_authors=xiaoeyun
