name: Publish Routes

on:
  push:
    tags: ["routes-v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The tag carries the mod version and the game version; gradle.properties
      # holds only the first. Disagreeing means shipping a jar labelled as a
      # version it is not, which mc-publish would do without complaint.
      - name: Version from tag
        id: version
        run: |
          V="${GITHUB_REF_NAME#routes-v}"
          echo "store=$V" >> "$GITHUB_OUTPUT"
          grep -qx "mod_version=${V%%-mc*}" route/gradle.properties

      # This mod alone. The other one failing to compile is not a reason a
      # release here cannot go out.
      - name: Build
        run: ./gradlew :route:build

      - name: Publish
        uses: Kira-NT/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          # Both mods share one release list, so the GitHub title has to say
          # which one it is; the store pages already know.
          github-name: "Create: Routes ${{ steps.version.outputs.store }}"
          name: ${{ steps.version.outputs.store }}
          version: ${{ steps.version.outputs.store }}
          modrinth-id: njXnqD1w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1657654
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          environment: client | server
          # A re-pushed tag should not die on Modrinth's "version already exists".
          modrinth-fail-mode: warn
          files: route/build/libs/*.jar
