name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: ./gradlew build

      - uses: astral-sh/setup-uv@v5

      - name: Lang files agree with the code
        run: uv run scripts/lang_audit.py
